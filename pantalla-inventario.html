<!doctype html>
<html lang="es" data-tema="industrial">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FastCold · Inventario en vivo</title>
<!-- Letras 2 y 3 vienen de Google Fonts; sin internet la pantalla cae a Bahnschrift (letra 1, ya viene en Windows). -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--font:Bahnschrift,"DIN Alternate","Segoe UI",system-ui,sans-serif}
/* Propuesta A · azul industrial: fondo marino oscuro con azules claros */
[data-tema="industrial"]{--bg:#081322;--bg2:#0e2036;--panel:#11263f;--line:#1f4168;--txt:#e8f1fb;--sub:#8eb2d6;
 --acc:#62b8ff;--acc2:#2c6db3;--chip:#183659;--ok:#62d2ff;--ap:#ffb21f;--ve:#2fd47b;--glow:rgba(98,184,255,.35);--over:rgba(4,10,20,.72)}
/* Propuesta B · azules claros y blancos */
[data-tema="claro"]{--bg:#eaf2fb;--bg2:#ffffff;--panel:#ffffff;--line:#cfe0f3;--txt:#0d2a47;--sub:#55708e;
 --acc:#1c6fd3;--acc2:#0d4b96;--chip:#e2edfb;--ok:#1c6fd3;--ap:#c97f00;--ve:#0f9c4c;--glow:rgba(28,111,211,.22);--over:rgba(225,236,250,.78)}
/* Tipografías: 1 Bahnschrift (en :root), 2 Barlow, 3 Exo 2 */
[data-letra="barlow"]{--font:"Barlow Semi Condensed",Bahnschrift,"Segoe UI",system-ui,sans-serif}
[data-letra="exo"]{--font:"Exo 2",Bahnschrift,"Segoe UI",system-ui,sans-serif}
/* Color elegido en el control: --acc llega en línea y de él salen el tono oscuro y el resplandor */
[data-color]{--acc2:color-mix(in srgb,var(--acc) 62%,#000);--glow:color-mix(in srgb,var(--acc) 32%,transparent)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);overflow:hidden}
body.control{overflow:auto}

/* ---------- Pantalla TV: escenario fijo 1920x1080 que se escala al tamaño de la tele ---------- */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;padding:28px 32px 20px;
 display:grid;grid-template-rows:auto 1fr auto;gap:20px;
 background:radial-gradient(1200px 600px at 85% -10%,var(--glow),transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg))}
header{display:flex;align-items:center;gap:28px}
.marca{display:flex;align-items:center;gap:28px}
.logo{width:470px;height:107px;background:var(--logo) no-repeat left center/contain;filter:var(--logo-sombra)}

.marca span{font-size:21px;color:var(--sub);letter-spacing:.1em;text-transform:uppercase;border-left:3px solid var(--acc2);padding-left:24px;line-height:1.5}
.vivo{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ve);margin-right:8px;animation:late 1.6s infinite}
@keyframes late{50%{opacity:.25}}
.totales{margin-left:auto;display:flex;gap:14px}
.tot{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 22px;text-align:center;min-width:150px}
.tot b{display:block;font-size:40px;line-height:1}
.tot span{font-size:15px;color:var(--sub);text-transform:uppercase;letter-spacing:.1em}
.tot.ok b{color:var(--ok)}.tot.ap b{color:var(--ap)}.tot.ve b{color:var(--ve)}
.reloj{font-size:44px;font-variant-numeric:tabular-nums;color:var(--sub);min-width:130px;text-align:right}

/* Una sola cuadrícula a lo ancho: disponibles arriba, luego vendidos y hasta abajo apartados.
   --cols y --h los calcula ajustar() para que todo quepa en la tele. */
main{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:hidden;--cols:4;--h:84px}
.grupo h2{font-size:21px;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);font-weight:600;
 padding:0 4px 8px;border-bottom:3px solid var(--acc2);margin-bottom:10px;display:flex;gap:16px;align-items:baseline}
.grupo h2 em{font-style:normal;color:var(--acc)}
.grupo.g-ve h2{border-color:var(--ve)}.grupo.g-ve h2 em{color:var(--ve)}
.grupo.g-ap h2{border-color:var(--ap)}.grupo.g-ap h2 em{color:var(--ap)}
.rejilla{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-auto-rows:var(--h);gap:9px}
.compacto .tile .d{display:none}.compacto .tile .n{align-self:center}
/* La letra de la tarjeta se ajusta al alto que le toca, para no esconder los detalles antes de tiempo */
#stage .tile{padding-top:calc(var(--h)*.07);padding-bottom:calc(var(--h)*.07)}
#stage .tile .n{font-size:min(23px,calc(var(--h)*.3))}
#stage .tile .chip{font-size:min(14.5px,calc(var(--h)*.2));padding:1px 7px}
#stage .tile .pill b{font-size:min(17px,calc(var(--h)*.24));padding:min(6px,calc(var(--h)*.06)) 12px}
.chip.china{background:var(--acc2);color:#fff;font-weight:600}
.tile{min-height:0;position:relative;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--ok);
 border-radius:12px;padding:8px 14px;display:grid;grid-template-columns:1fr auto;grid-template-rows:1fr auto;column-gap:10px;align-content:center;overflow:hidden}
.tile .n{font-size:23px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:end}
.tile .d{grid-column:1/3;display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden;align-self:start;margin-top:4px}
.chip{font-size:14.5px;background:var(--chip);color:var(--sub);border-radius:6px;padding:2px 8px;white-space:nowrap}
.chip.l{color:var(--acc);font-weight:600}
.pill{grid-column:2;grid-row:1;align-self:end;text-align:right;white-space:nowrap}
.pill b{display:inline-block;font-size:17px;font-weight:700;letter-spacing:.06em;padding:6px 12px;border-radius:8px;
 color:var(--ok);border:2px solid var(--ok);white-space:nowrap}
.pill small{font-size:15px;color:var(--sub);white-space:nowrap}
.pill{display:flex;gap:10px;flex-direction:row-reverse;align-items:center;justify-content:flex-start}
.pill small i{font-style:normal;font-weight:700}
.pill small .a{color:var(--ap)}.pill small .v{color:var(--ve)}
.st-ap{border-left-color:var(--ap)}.st-ap .pill b{color:var(--ap);border-color:var(--ap)}
.st-ve{border-left-color:var(--ve)}.st-ve .pill b{background:var(--ve);border-color:var(--ve);color:#fff}
.st-ve .n,.st-ve .d{opacity:.55}
.flash{animation:flash 1s ease-in-out 4}
@keyframes flash{50%{box-shadow:0 0 0 4px var(--ap),0 0 34px var(--ap)}}
.flash.st-ve{animation-name:flashv}@keyframes flashv{50%{box-shadow:0 0 0 4px var(--ve),0 0 34px var(--ve)}}
.tile:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-100%)}
.flash:after{animation:brillo 1.4s ease-out 3}
@keyframes brillo{to{transform:translateX(100%)}}

footer{display:flex;gap:26px;font-size:16px;color:var(--sub);align-items:center}
footer i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:7px;vertical-align:-2px}
footer .r{margin-left:auto}

/* Festejo */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
#fiesta{position:fixed;inset:0;display:grid;place-items:center;background:var(--over);z-index:10;opacity:0;pointer-events:none;transition:opacity .4s}
#fiesta.on{opacity:1}
#fiesta .card{text-align:center;padding:5vh 7vw;border-radius:3vh;background:var(--panel);border:.6vh solid var(--c);
 box-shadow:0 0 12vh var(--c);transform:scale(.6);transition:transform .6s cubic-bezier(.2,1.6,.4,1);position:relative;overflow:hidden}
#fiesta.on .card{transform:scale(1)}
#fiesta .card:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);animation:brillo 1.6s ease-out infinite}
#fiesta h1{font-size:13vh;line-height:1;color:var(--c);letter-spacing:.06em}
#fiesta p{font-size:5vh;margin-top:2vh;font-weight:600}
#fiesta small{display:block;font-size:2.8vh;color:var(--sub);margin-top:1vh;letter-spacing:.12em;text-transform:uppercase}

/* ---------- Control (otra ventana, en la laptop) ---------- */
#ctl{display:none;max-width:1100px;margin:0 auto;padding:20px 16px 60px}
body.control #stage,body.control #fiesta{display:none}
body.control #ctl{display:block}
.barra{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.barra h1{font-size:24px;color:var(--acc);margin-right:auto}
button,input{font:inherit;font-size:16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--txt);padding:9px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.35;cursor:default}
button[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
button.ap{border-color:var(--ap);color:var(--ap)}button.ve{background:var(--ve);border-color:var(--ve);color:#fff}
input{cursor:text;min-width:220px}
.color{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:15px}
input[type=color]{min-width:0;width:50px;height:40px;padding:3px;cursor:pointer}
.muestra{width:32px;height:32px;padding:0;border-radius:50%;border:2px solid var(--line)}
.muestra[aria-pressed="true"]{outline:3px solid var(--txt);outline-offset:2px}
#ultimo{width:100%;color:var(--sub);font-size:15px}
.sec{margin-top:22px}
.sec h2{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);margin-bottom:8px}
.fila{display:grid;grid-template-columns:1fr 150px auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);
 border-left:5px solid var(--ok);border-radius:10px;padding:9px 12px;margin-bottom:6px}
.fila.st-ap{border-left-color:var(--ap)}.fila.st-ve{border-left-color:var(--ve)}
.fila b{font-size:17px}.fila small{display:block;color:var(--sub);font-size:13px}
.fila .q{font-size:14px;color:var(--sub)}.fila .q b{color:var(--txt);font-size:16px}
.fila .bt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:700px){.fila{grid-template-columns:1fr}.fila .bt{justify-content:flex-start}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="fiesta"><div class="card"><h1></h1><p></p><small></small></div></div>
<canvas id="fx"></canvas>
<div id="ctl"></div>
<script>
// shortcut: datos copiados a mano del Excel "MAQUINAS CON PRECIOS" (17-nov); si cambia el inventario, se edita esta lista.
const SEC={bod:'En bodega',ref:'Refrigeración Glacial',chn:'Stock en China'};
const ITEMS=[
 {id:'b1',s:'bod',q:2,n:'1T Tube 3HP',l:'Hielo en tubo',c:'1 ton',e:'Air cooled',a:'220/60Hz/3F',x:'Series 26040211717T · 26012811589T'},
 {id:'b2',s:'bod',q:3,n:'2T Tube 3HP',l:'Hielo en tubo',c:'2 ton',e:'Air cooled',a:'220/60Hz/3F',x:'Series 26052611857T · 26020511633T · 26012811597T'},
 {id:'b3',s:'bod',q:1,n:'3T Tube 3HP',l:'Hielo en tubo',c:'3 ton',e:'Air cooled',a:'220/60Hz/3F',x:'Serie 26060111880T'},
 {id:'b4',s:'bod',q:1,n:'1T Barra 3HP',l:'Hielo en barra',c:'1 ton',e:'Air cooled',a:'220/60Hz/3F',x:'Serie 26060111879B'},
 {id:'b5',s:'bod',q:3,n:'Hielo en escama 1T',l:'Hielo en escama',c:'1 ton',e:'Air cooled',a:'220/60Hz/3F'},
 {id:'b6',s:'bod',q:2,n:'Hielo en escama 2T',l:'Hielo en escama',c:'2 ton',e:'Air cooled',a:'220/60Hz/3F'},
 {id:'b7',s:'bod',q:1,n:'Hielo en escama 5T',l:'Hielo en escama',c:'5 ton',e:'Air cooled',a:'220/60Hz/3F'},
 {id:'b8',s:'bod',q:1,n:'PDA 500 L/h',l:'Planta de agua',c:'500 L/h',a:'220/60Hz/1F',x:'Serie PDA500-0027'},
 {id:'b9',s:'bod',q:3,n:'PDA 1000 L/h',l:'Planta de agua',c:'1000 L/h',a:'220/60Hz/1F',x:'Series PDA1000-0004 · 0025 · 0023'},
 {id:'b10',s:'bod',q:1,n:'Cuarto frío 5×3×3',l:'Cuarto frío',c:'Unidad 8HP'},
 {id:'r1',s:'ref',q:6,n:'Unidad 5HP + evaporador',l:'YM86E7G-100',c:'-8 °C',e:'Media temp.',a:'220/60Hz/3F'},
 {id:'r2',s:'ref',q:5,n:'Unidad 5HP + evaporador',l:'YM86E7G-100',c:'-8 °C',e:'Media temp.',a:'220/60Hz/1F'},
 {id:'r3',s:'ref',q:5,n:'Unidad 6HP + evaporador',l:'YM102E7G-100',c:'-8 °C',e:'Media temp.',a:'220/60Hz/3F'},
 {id:'r4',s:'ref',q:4,n:'Unidad 8HP + evaporador',l:'YM132E7G-100',c:'-8 °C',e:'Media temp.',a:'220/60Hz/3F'},
 {id:'r5',s:'ref',q:8,n:'Unidad 10HP + evaporador',l:'YM182E7G-100',c:'-8 °C',e:'Media temp.',a:'220/60Hz/3F'},
 {id:'r6',s:'ref',q:16,n:'Control + válvula 5P/6P',l:'Danfoss TGES-5',c:'Caja de control'},
 {id:'r7',s:'ref',q:4,n:'Control + válvula 8P',l:'Danfoss TGES-5',c:'Caja de control'},
 {id:'r8',s:'ref',q:8,n:'Control + válvula 10P',l:'Danfoss TGES-7.5',c:'Caja de control'},
 {id:'r9',s:'ref',q:1,n:'Unidad sencilla 8HP',l:'Con válvula y control',c:'Evaporador',e:'Media temp.'},
 {id:'r10',s:'ref',q:6,n:'Unidad sencilla 3HP',l:'Con válvula y control',c:'Evaporador',e:'Media temp.'},
 {id:'c1',s:'chn',q:2,n:'1T Tube 28 mm',l:'Hielo en tubo',c:'1 ton',e:'Air cooled',a:'220/60Hz/1F'},
 {id:'c2',s:'chn',q:3,n:'1T Tube 28 mm',l:'Hielo en tubo',c:'1 ton',e:'Air cooled',a:'220/60Hz/3F'},
 {id:'c3',s:'chn',q:6,n:'2T Tube 35 mm',l:'Hielo en tubo',c:'2 ton',e:'Air cooled',a:'220/60Hz/3F'},
 {id:'c4',s:'chn',q:1,n:'2T Tube 35 mm',l:'Hielo en tubo',c:'2 ton',e:'Water cooled',a:'220/60Hz/3F'},
 {id:'c5',s:'chn',q:1,n:'3T Tube 35 mm',l:'Hielo en tubo',c:'3 ton',e:'Air cooled',a:'220/60Hz/3F'},
 {id:'c6',s:'chn',q:2,n:'3T Tube 35 mm',l:'Hielo en tubo',c:'3 ton',e:'Water cooled',a:'220/60Hz/3F'},
 {id:'c7',s:'chn',q:2,n:'5T Tube 35 mm',l:'Hielo en tubo',c:'5 ton',e:'Air cooled',a:'220/60Hz/3F'},
 {id:'c8',s:'chn',q:2,n:'5T Tube 35 mm',l:'Hielo en tubo',c:'5 ton',e:'Water cooled',a:'220/60Hz/3F'},
 {id:'c9',s:'chn',q:3,n:'1T Flake',l:'Hielo en escama',c:'1 ton',e:'Air cooled',a:'220/60Hz/3F'},
 {id:'c10',s:'chn',q:2,n:'2T Flake',l:'Hielo en escama',c:'2 ton',e:'Air cooled',a:'220/60Hz/3F'},
];
const BY=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const CONTROL=location.hash==='#control';

// ---- Estado compartido entre la ventana de control y la de la tele (misma compu, mismo navegador) ----
const KEY='fc-pantalla-inventario-v1';
const base=()=>({tema:'industrial',m:{},seq:0,last:null});
function load(){try{return Object.assign(base(),JSON.parse(localStorage.getItem(KEY)))}catch{return base()}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{alert('No se pudo guardar: el navegador bloquea el almacenamiento.')}render()}
addEventListener('storage',e=>{if(e.key!==KEY)return;const prev=S.seq;S=load();render();if(!CONTROL&&S.seq>prev&&S.last)festejar(S.last)});

const M=id=>S.m[id]||{ap:0,ve:0,h:[]};
const disp=it=>it.q==null?Infinity:it.q-M(it.id).ap-M(it.id).ve;
// Aplica una acción a las marcas de un producto; devuelve false si no procede.
function apply(m,q,t){
 const d=q==null?Infinity:q-m.ap-m.ve;
 if(t==='ap'||t==='ve'){if(d<=0)return false;m[t]++}
 else if(t==='apve'){if(!m.ap)return false;m.ap--;m.ve++}
 else if(t==='undo'){const x=m.h.pop();if(!x)return false;if(x==='apve'){m.ve--;m.ap++}else m[x]--;return true}
 else return false;
 m.h.push(t);return true;
}
(()=>{const m={ap:0,ve:0,h:[]};console.assert(apply(m,1,'ap')&&!apply(m,1,'ve')&&apply(m,1,'apve')&&m.ve===1&&m.ap===0
 &&apply(m,1,'undo')&&m.ap===1&&m.ve===0&&apply(m,1,'undo')&&m.ap===0&&!apply(m,1,'undo')&&apply(m,null,'ve')&&apply(m,null,'ve')&&m.ve===2,'apply() falla')})();
function act(id,t){
 const m=S.m[id]||(S.m[id]={ap:0,ve:0,h:[]});
 if(!apply(m,BY[id].q,t))return;
 if(t!=='undo'){S.seq++;S.last={id,t:t==='ap'?'ap':'ve',seq:S.seq};m[t==='ap'?'ta':'tv']=S.seq} // ta/tv: orden de llegada a su grupo
 save();
}

function estado(it){ // clase y textos de la pastilla
 const m=M(it.id),d=disp(it);
 const cuenta=(m.ap||m.ve)?`<small>${m.ap?`<i class="a">${m.ap} apartado${m.ap>1?'s':''}</i>`:''}${m.ap&&m.ve?' · ':''}${m.ve?`<i class="v">${m.ve} vendido${m.ve>1?'s':''}</i>`:''}</small>`:'';
 if(d<=0){const st=m.ve>=m.ap?'ve':'ap';return{c:'st-'+st,b:st==='ve'?'VENDIDO':'APARTADO',small:it.q>1?cuenta:''}}
 return{c:'',b:it.q>1?`${d} DE ${it.q}`:'DISPONIBLE',small:cuenta};
}
const chips=it=>[it.s==='chn'&&'<span class="chip china">China</span>',it.l&&`<span class="chip l">${it.l}</span>`,it.c,it.e,it.a].filter(Boolean).map(x=>x.startsWith('<')?x:`<span class="chip">${x}</span>`).join('');

// Un producto sale en cada grupo donde tiene piezas: "2 DE 3" en disponibles y "1 APARTADO" abajo.
function grupos(){
 const ok=ITEMS.filter(it=>disp(it)>0);
 const ve=ITEMS.filter(it=>M(it.id).ve>0).sort((a,b)=>(M(a.id).tv||0)-(M(b.id).tv||0));
 const ap=ITEMS.filter(it=>M(it.id).ap>0).sort((a,b)=>(M(a.id).ta||0)-(M(b.id).ta||0));
 return {ok,ve,ap};
}
function renderTV(){
 const tot={ok:0,ap:0,ve:0};
 ITEMS.forEach(it=>{const m=M(it.id);tot.ap+=m.ap;tot.ve+=m.ve;tot.ok+=disp(it)});
 const G=grupos();
 const tile=(it,g)=>{const m=M(it.id),n=g==='ve'?m.ve:m.ap;
  const b=g==='ok'?(it.q>1?`${disp(it)} DE ${it.q}`:'DISPONIBLE'):(g==='ve'?(n>1?`${n} VENDIDOS`:'VENDIDO'):(n>1?`${n} APARTADOS`:'APARTADO'));
  return `<div class="tile ${g==='ok'?'':'st-'+g}" data-id="${it.id}" data-g="${g}"><div class="n">${it.n}</div><div class="d">${chips(it)}</div><div class="pill"><b>${b}</b></div></div>`};
 const grupo=(g,titulo,n)=>G[g].length?`<section class="grupo g-${g}"><h2>${titulo}<em>${n} ${n===1?'pieza':'piezas'}</em></h2><div class="rejilla">${G[g].map(it=>tile(it,g)).join('')}</div></section>`:'';
 document.getElementById('stage').innerHTML=`
 <header><div class="marca"><div class="logo" role="img" aria-label="FastCold · Tecnología para la conservación"></div><span>Inventario disponible<br><i class="vivo"></i>En vivo</span></div>
  <div class="totales"><div class="tot ok"><b>${tot.ok}</b><span>Disponibles</span></div><div class="tot ap"><b>${tot.ap}</b><span>Apartados</span></div><div class="tot ve"><b>${tot.ve}</b><span>Vendidos</span></div></div>
  <div class="reloj" id="reloj"></div></header>
 <main>${grupo('ok','Disponibles',tot.ok)}${grupo('ve','Vendidos',tot.ve)}${grupo('ap','Apartados',tot.ap)}</main>
 <footer><span><i style="background:var(--ok)"></i>Disponible</span><span><i style="background:var(--ap)"></i>Apartado</span><span><i style="background:var(--ve)"></i>Vendido</span><span class="r">Pregunta a un asesor FastCold por tu equipo</span></footer>`;
 reloj();ajustar();
}
// Reparte el alto libre entre las filas de tarjetas; con muchas tarjetas sube a 5 columnas y esconde los detalles.
function ajustar(){
 const main=document.querySelector('#stage main');if(!main)return;
 const secs=[...main.querySelectorAll('.grupo')],n=main.querySelectorAll('.tile').length,cols=n>36?5:4,gap=9;
 main.style.setProperty('--cols',cols);
 const filas=secs.reduce((a,s)=>a+Math.ceil(s.querySelector('.rejilla').children.length/cols),0);
 const fijo=secs.reduce((a,s)=>a+s.querySelector('h2').offsetHeight+10,0)+(secs.length-1)*14+(filas-secs.length)*gap;
 const h=Math.min(96,Math.floor((main.clientHeight-fijo-2)/Math.max(filas,1)));
 main.style.setProperty('--h',h+'px');main.classList.toggle('compacto',h<54);
}
function reloj(){const r=document.getElementById('reloj');if(r)r.textContent=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}
setInterval(reloj,10000);

let filtro='',reinicio=0;
function renderCtl(){
 const ctl=document.getElementById('ctl');
 const f=filtro.toLowerCase();
 const fila=it=>{const m=M(it.id),d=disp(it),e=estado(it);
  return `<div class="fila ${e.c}"><div><b>${it.n}</b><small>${[it.l,it.c,it.e,it.a,it.x].filter(Boolean).join(' · ')}</small></div>
  <div class="q">${it.q==null?'Sin tope':`Quedan <b>${d}</b> de ${it.q}`}<br>Ap ${m.ap} · Vend ${m.ve}</div>
  <div class="bt"><button class="ap" data-a="ap" data-id="${it.id}" ${d<=0?'disabled':''}>Apartar</button>
  <button class="ve" data-a="ve" data-id="${it.id}" ${d<=0?'disabled':''}>Vendido</button>
  <button data-a="apve" data-id="${it.id}" ${m.ap?'':'disabled'} title="Un apartado pasa a vendido">Apartado → vendido</button>
  <button data-a="undo" data-id="${it.id}" ${m.h.length?'':'disabled'}>Deshacer</button></div></div>`};
 const lista=Object.keys(SEC).map(s=>{const its=ITEMS.filter(i=>i.s===s&&(i.n+' '+(i.l||'')+' '+(i.c||'')+' '+(i.e||'')+' '+(i.a||'')).toLowerCase().includes(f));
  return its.length?`<div class="sec"><h2>${SEC[s]}</h2>${its.map(fila).join('')}</div>`:''}).join('');
 const u=S.last&&BY[S.last.id];
 const foco=document.activeElement&&document.activeElement.id==='buscar';
 ctl.innerHTML=`<div class="barra"><h1>Control · pantalla de inventario</h1>
  <button data-x="abrir">Abrir pantalla TV</button>
  <button data-x="tema" data-t="industrial" aria-pressed="${S.tema==='industrial'}">A · Industrial</button>
  <button data-x="tema" data-t="claro" aria-pressed="${S.tema==='claro'}">B · Claro</button>
  <span class="color">Letra ${LETRAS.map(([k,n,f])=>`<button data-x="letra" data-l="${k}" style="font-family:${f}" aria-pressed="${(S.letra||'bahn')===k}">${n}</button>`).join('')}</span>
  <span class="color">Color <input type="color" id="color" aria-label="Elegir color principal" value="${S.color||getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()}">
  ${MUESTRAS.map(c=>`<button class="muestra" data-x="color" data-c="${c}" style="background:${c}" aria-label="Color ${c}" aria-pressed="${S.color===c}"></button>`).join('')}
  <button data-x="color" data-c="" aria-pressed="${!S.color}">Original</button></span>
  <button data-x="reinicio">${Date.now()-reinicio<4000?'¿Seguro? Toca otra vez':'Reiniciar todo'}</button>
  <input id="buscar" placeholder="Buscar modelo…" value="${filtro.replace(/"/g,'&quot;')}">
  <div id="ultimo">${u?`Último: <b>${u.n}</b> ${S.last.t==='ap'?'apartado':'vendido'}`:'Sin movimientos todavía.'} La tele festeja cada Apartar / Vendido.</div></div>${lista}`;
 if(foco){const b=document.getElementById('buscar');b.focus();b.setSelectionRange(b.value.length,b.value.length)}
}
document.getElementById('ctl').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.a)return act(b.dataset.id,b.dataset.a);
 const x=b.dataset.x;
 if(x==='abrir')window.open(location.href.split('#')[0],'fc-tv');
 if(x==='tema'){S.tema=b.dataset.t;save()}
 if(x==='color'){S.color=b.dataset.c;save()}
 if(x==='letra'){S.letra=b.dataset.l;save()}
 if(x==='reinicio'){if(Date.now()-reinicio<4000){S=Object.assign(base(),{tema:S.tema,letra:S.letra,color:S.color});reinicio=0;save()}else{reinicio=Date.now();renderCtl()}}
});
document.getElementById('ctl').addEventListener('input',e=>{if(e.target.id==='buscar'){filtro=e.target.value;renderCtl()}});
// 'change' y no 'input': el control se redibuja al guardar y cerraría el selector a medio arrastre.
document.getElementById('ctl').addEventListener('change',e=>{if(e.target.id==='color'){S.color=e.target.value;save()}});
const MUESTRAS=['#387CA6','#7EBFD9','#0096D6','#1C6FD3','#00B4D8','#51A65E'];
const LETRAS=[['bahn','1 · Bahnschrift','Bahnschrift'],['barlow','2 · Barlow',"'Barlow Semi Condensed'"],['exo','3 · Exo 2',"'Exo 2'"]];

function render(){
 const r=document.documentElement;r.dataset.tema=S.tema;r.dataset.letra=S.letra||'bahn';
 if(S.color){r.style.setProperty('--acc',S.color);r.dataset.color=''}else{r.style.removeProperty('--acc');delete r.dataset.color}
 CONTROL?renderCtl():renderTV();
}
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${s})`;fx.width=innerWidth;fx.height=innerHeight}
addEventListener('resize',fit);
document.fonts.ready.then(()=>ajustar()); // la letra de Google llega después y cambia el alto de los títulos
addEventListener('dblclick',()=>{if(!CONTROL&&!document.fullscreenElement)document.documentElement.requestFullscreen?.()});
addEventListener('hashchange',()=>location.reload());

// ---- Festejo: tarjeta grande + confeti (vendido) o brillos (apartado) ----
const fx=document.getElementById('fx'),cx=fx.getContext('2d');let P=[],corriendo=false,tFiesta;
const quieto=matchMedia('(prefers-reduced-motion: reduce)').matches;
function festejar({id,t}){
 const it=BY[id],ve=t==='ve',f=document.getElementById('fiesta');
 f.style.setProperty('--c',`var(--${ve?'ve':'ap'})`);
 f.querySelector('h1').textContent=ve?'¡VENDIDO!':'¡APARTADO!';
 f.querySelector('p').textContent=it.n;
 f.querySelector('small').textContent=[it.l,it.c,it.e].filter(Boolean).join(' · ')+' · ¡Felicidades!';
 f.classList.add('on');clearTimeout(tFiesta);tFiesta=setTimeout(()=>f.classList.remove('on'),5200);
 const tile=document.querySelector(`[data-id="${id}"][data-g="${t}"]`);tile&&tile.classList.add('flash');
 if(quieto)return;
 const W=fx.width,H=fx.height,r=()=>Math.random(),pick=a=>a[(r()*a.length)|0];
 const oro=['#ffd76a','#fff3c4','#ffffff','#ffb21f','#bfe3ff'],fiesta=['#2fd47b','#ffd23f','#62b8ff','#ff5d8f','#ffffff','#8b5cf6','#ff9f1c'];
 const caer=(n,cols)=>{for(let i=0;i<n;i++){const L=i%2===0;P.push({k:'c',x:L?0:W,y:H*.9,vx:(L?1:-1)*(W/180)*(.5+r()),vy:-(H/55)*(.7+r()*.6),g:H/2600,a:r()*6,va:(r()-.5)*.35,w:8+r()*9,h:5+r()*6,c:pick(cols),v:200+r()*80})}};
 const brillar=(n,cols)=>{for(let i=0;i<n;i++)P.push({k:'s',x:W*(.08+.84*r()),y:H*(.08+.84*r()),vx:(r()-.5)*.6,vy:-r()*.8,g:0,a:r()*6,va:.15,w:5+r()*13,c:pick(cols),v:90+r()*150})};
 if(ve){caer(300,fiesta);brillar(70,oro);setTimeout(()=>caer(180,fiesta),700)}else{brillar(190,oro);caer(90,oro)}
 if(P.length>900)P=P.slice(-900); // varias marcas seguidas no se encimen ni traben la tele
 if(!corriendo){corriendo=true;requestAnimationFrame(paso)}
}
function estrella(x,y,s){cx.beginPath();cx.moveTo(x,y-s);cx.quadraticCurveTo(x,y,x+s,y);cx.quadraticCurveTo(x,y,x,y+s);cx.quadraticCurveTo(x,y,x-s,y);cx.quadraticCurveTo(x,y,x,y-s);cx.fill()}
function paso(){
 cx.clearRect(0,0,fx.width,fx.height);
 P=P.filter(p=>--p.v>0&&p.y<fx.height+40);
 for(const p of P){
  p.vx*=.99;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;cx.fillStyle=p.c;
  if(p.k==='c'){cx.globalAlpha=Math.min(1,p.v/40);cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.a*1.7)));cx.restore()}
  else{cx.globalAlpha=Math.min(1,p.v/40)*(.55+.45*Math.sin(p.a));estrella(p.x,p.y,p.w)}
 }
 cx.globalAlpha=1;
 if(P.length)requestAnimationFrame(paso);else corriendo=false;
}

document.body.classList.toggle('control',CONTROL);
fit();render();
</script>
</body>
</html>
